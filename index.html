if (saved) open_(saved).catch(() => { try { localStorage.removeItem('tdb_pw'); } catch (e) {} });
document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault(); const pw = document.getElementById('pw').value, keep = document.getElementById('keep').checked;
  // 18/10 21:20: read the box before open_() replaces the page (it was always null after, the password was never kept)
  try { await open_(pw); try { if (keep) localStorage.setItem('tdb_pw', pw); } catch (e) {} }
  catch (e) { document.getElementById('err').textContent = 'Mot de passe incorrect.'; }
});
