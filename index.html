async function open_(pw) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b(P.salt), iterations: P.iter, hash: 'SHA-256' }, base,
    { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b(P.iv) }, key, b(P.ct));
  const html = new TextDecoder().decode(plain);
  document.open(); document.write(html); document.close();
}

document.getElementById('f').addEventListener('submit', async (ev) => {
  ev.preventDefault(); const pw = document.getElementById('pw').value, keep = document.getElementById('keep').checked;

  try { await open_(pw); try { if (keep) localStorage.setItem('tdb_pw', pw); } catch (e) {} }

});
